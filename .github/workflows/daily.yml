name: Update All Rankings
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Verhindert, dass mehrere Instanzen dieses Workflows gleichzeitig laufen
concurrency:
  group: update-rankings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Holt die Historie, wichtig für saubere Rebase-Operationen
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python update_ranking.py
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}

      - run: python print_rankings.py

      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add ranking_*.json rankings_output/
          
          # Nur committen und pushen, wenn es echte Änderungen gibt
          if ! git diff --cached --quiet; then
            git commit -m "chore: update rankings [skip ci]"
            
            # Vor dem Push die neuesten Remote-Änderungen holen und oben aufschlagen
            git pull --rebase origin main
            
            # Änderungen hochladen
            git push origin main
          else
            echo "Keine Änderungen an den Rankings festgestellt."
          fi
